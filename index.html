:root{
  --ink:#1F1B24;--ink2:#4A4550;--muted:#6B6570;
  --page:#FBF8F3;--card:#FFFFFF;--line:#E6DED3;--line2:#D6CCBF;
  --blue:#D4E8FA;--blueInk:#2F5E8F;--blueEdge:#7FAEDD;
  --mint:#D6F3E4;--mintInk:#2F6B4F;--mintEdge:#6FB592;
  --peach:#FFE1CF;--peachInk:#8A4B1C;--peachEdge:#E3A47A;
  --note:#EEF1F5;--noteEdge:#A9B6C6;
  --r:18px;
  --shadow:0 1px 2px rgba(31,27,36,.06),0 8px 24px rgba(31,27,36,.07);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--page);color:var(--ink);font-family:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;font-size:20px;line-height:1.6;letter-spacing:.005em;-webkit-font-smoothing:antialiased}
h1,h2{font-family:'Fraunces',Georgia,serif;font-weight:600;line-height:1.15;margin:0 0 .4em;letter-spacing:-.005em}
h1{font-size:40px}h2{font-size:32px}
p{margin:0 0 .7em}
b{font-weight:700}
button{font-family:inherit;color:inherit}

/* top */
.top{position:sticky;top:0;z-index:40;background:var(--page);border-bottom:1px solid var(--line)}
.top-in{max-width:820px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:'Fraunces';font-weight:600;font-size:21px;line-height:1.15}
.brand small{display:block;font-family:'Hanken Grotesk';font-weight:600;font-size:14px;color:var(--ink2)}
.progress{flex:1;min-width:140px;display:flex;align-items:center;gap:10px}
.bar{flex:1;height:10px;border-radius:999px;background:#E9E3DA;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--mintInk);border-radius:999px;transition:width .4s ease}
.pcount{font-size:14px;font-weight:700;color:var(--ink2);white-space:nowrap}
.points{background:#FFF2B8;border:1.5px solid #E6CF6A;color:#5C4600;border-radius:999px;padding:3px 12px;font-weight:700;font-size:15px;white-space:nowrap}
.points.bump{animation:bump .5s ease}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.sampletag{font-size:13.5px;font-weight:600;color:var(--ink2);background:#EFEAE3;border-radius:999px;padding:3px 10px;white-space:nowrap}

/* page */
.wrap{max-width:820px;margin:0 auto;padding:22px 20px 150px}
#page{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.kindbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.kpill{border-radius:999px;padding:4px 14px;font-weight:700;font-size:15.5px;border:1.5px solid rgba(0,0,0,.12)}
.exlabel{font-weight:700;font-size:15.5px;color:var(--ink2)}
.rule{background:#fff;border:1.5px dashed var(--line2);border-radius:14px;padding:8px 14px;font-size:17px;margin-bottom:14px}
.where{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;margin:0 0 12px}
.wtag{font-weight:700;font-size:18px}
.wreader{font-size:16.5px;color:var(--ink2)}

/* job box */
.job{background:var(--blue);border:2px solid var(--blueEdge);border-left:8px solid var(--blueInk);border-radius:16px;padding:12px 16px 12px;margin:0 0 16px}
.jobhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.jobtitle{font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--blueInk)}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:10px;align-items:flex-start;padding:5px 8px;border-radius:10px;font-size:19px;line-height:1.45}
.steps li .n{flex:none;width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid var(--blueInk);color:var(--blueInk);font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.steps li.now{background:#fff;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.steps li.now .n{background:var(--blueInk);color:#fff}
.steps li.did{color:var(--ink2)}
.steps li.did .n{background:var(--mintInk);border-color:var(--mintInk);color:#fff}
.jobnote{font-size:16.5px;color:var(--ink2);margin:6px 0 0 8px}
.listen{border:1.5px solid var(--blueEdge);background:#fff;border-radius:999px;padding:3px 12px;font-size:15px;font-weight:700;cursor:pointer}

/* sentence card */
.sentcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px 14px;margin:0 0 14px}
.sentlabel{font-size:15px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.sentlabel .carry{background:#EFEAE3;border-radius:999px;padding:1px 10px;margin-left:6px;font-weight:700}
.sent{font-size:25px;line-height:2.05;margin:0}
.chunk{font:inherit;font-size:25px;line-height:1.5;display:inline;background:#FAF8F5;border:2px dashed #C9BFB1;border-radius:10px;padding:1px 7px;margin:0 1px;cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background .2s,border-color .2s,transform .2s;color:var(--ink);text-align:left}
.chunk:hover{background:#F1ECE4;border-color:#9E9384}
.chunk:focus-visible{outline:3px solid var(--blueInk);outline-offset:2px}
.chunk.sel{background:#E6DDF8;border:2px solid #5C4A9E}
.chunk.fixed{background:var(--mint);border:2px solid var(--mintEdge);cursor:default}
.chunk.shake{animation:shake .4s ease}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.chunk.leaving{transition:transform .45s ease,opacity .45s ease;transform:translateY(-22px) scale(.75) rotate(-4deg);opacity:0}
.chunk.pop{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.chunk[disabled]{cursor:default}
.plain{font-size:25px}
.punct{font-size:25px}
.tapnote{font-size:15.5px;color:var(--ink2);margin:6px 0 0}
.counts{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;align-items:center}
.cnt{border-radius:999px;padding:4px 12px;font-weight:700;font-size:16px;background:#F1EEEA;color:var(--ink2)}
.cnt.now{background:var(--mint);color:var(--mintInk)}
.cnt.over{background:var(--peach);color:var(--peachInk)}
.cnt.same{background:#F1EEEA;color:var(--ink2)}
.bin{border-radius:999px;padding:4px 12px;font-weight:700;font-size:16px;background:#fff;border:1.5px dashed var(--line2);color:var(--ink2)}

/* tiles */
.tilezone{margin:4px 0 14px}
.tilehead{font-weight:700;font-size:16.5px;color:var(--ink2);margin-bottom:8px}
.tiles{display:flex;flex-wrap:wrap;gap:10px}
.tile{background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:9px 16px;font-weight:700;font-size:21px;cursor:pointer;box-shadow:0 3px 0 var(--ink);line-height:1.3;min-height:48px}
.tile:hover{background:#FFFBEF}
.tile:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.tile:focus-visible{outline:3px solid var(--blueInk);outline-offset:2px}
.tile.wrong{border-color:var(--peachEdge);box-shadow:0 3px 0 var(--peachEdge);color:var(--peachInk);background:var(--peach)}
.tile.used{visibility:hidden}
.flyer{position:fixed;z-index:300;pointer-events:none;transition:transform .5s cubic-bezier(.3,.8,.3,1),opacity .5s ease;display:flex;align-items:center;justify-content:center;background:#fff;border:2.5px solid var(--ink);border-radius:14px;font-weight:700;font-size:20px;white-space:nowrap;overflow:hidden;box-shadow:0 10px 24px rgba(31,27,36,.2)}
.flyer.cutfly{background:#FAF8F5;border-style:dashed;border-color:#C9BFB1;font-weight:400}

/* build */
.answer{min-height:64px;border:2.5px dashed var(--blueEdge);border-radius:16px;background:#F7FBFF;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.answer .ph{color:var(--muted);font-size:17px;padding:4px 6px}
.answer .tile{font-size:20px}
.bank{display:flex;flex-wrap:wrap;gap:10px;min-height:56px}
.btnrow{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:4px 0 14px}

/* type */
.longv{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;margin:0 0 14px;box-shadow:var(--shadow)}
.longv .sent{font-size:22px;line-height:1.6}
textarea{width:100%;font:inherit;font-size:21px;line-height:1.6;padding:12px 14px;border-radius:14px;border:2.5px solid var(--line2);background:#fff;color:var(--ink);resize:vertical;min-height:120px}
textarea:focus{outline:none;border-color:var(--blueInk);box-shadow:0 0 0 4px rgba(47,94,143,.18)}
textarea[readonly]{background:#F3F0EB}
.checks{margin:6px 0 12px}
.check{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:10px 14px;margin-bottom:8px;font-size:18.5px}
.check.pass{background:var(--mint)}
.check.fail{background:var(--peach)}
.check .ic{font-size:21px;line-height:1.3;flex:none}
details.model{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:10px 0}
details.model summary{cursor:pointer;font-weight:800}
.small{font-size:16px;color:var(--ink2)}

/* choose */
.opts{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#fff;border:2.5px solid var(--line2);border-radius:16px;padding:12px 16px;font-size:21px;line-height:1.45;cursor:pointer;box-shadow:0 2px 0 var(--line2)}
.opt:hover{border-color:var(--ink)}
.opt .letter{flex:none;width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:17px;margin-top:2px}
.opt.right{background:var(--mint);border-color:var(--mintEdge)}
.opt.wrong{background:var(--peach);border-color:var(--peachEdge)}

/* spot */
.spotgrid{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 4px}
.spotchip{font:inherit;font-size:21px;background:#FAF8F5;border:2px dashed #C9BFB1;border-radius:14px;padding:8px 14px;cursor:pointer;min-height:48px;color:var(--ink)}
.spotchip:hover{background:#F1ECE4}
.spotchip.picked{background:#E6DDF8;border:2px solid #5C4A9E;font-weight:700}
.spotchip.isbad{text-decoration:line-through;text-decoration-thickness:3px;text-decoration-color:#4A4550;color:#6B6570;background:#fff;border:2px solid var(--line2);cursor:default}
.spotchip.isok{background:#fff;border:2px solid var(--line);cursor:default}
.why{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin:0 0 14px}
.whyrow{margin:4px 0;font-size:18.5px}
/* feedback */
.fb{border-radius:16px;padding:12px 16px;margin:0 0 14px;border-left:8px solid;font-size:19px;line-height:1.5}
.fb.good{background:var(--mint);border-color:var(--mintEdge)}
.fb.miss{background:var(--peach);border-color:var(--peachEdge)}
.fb.note{background:var(--note);border-color:var(--noteEdge)}
.fb .next{display:block;margin-top:4px;font-weight:700}
.thought{display:flex;align-items:flex-end;gap:10px;margin:4px 0 16px}
.face{font-size:34px;line-height:1;flex:none}
.tcloud{position:relative;background:#fff;border:2.5px solid var(--ink);border-radius:30px;padding:10px 16px;font-weight:700;font-size:18.5px;line-height:1.35;box-shadow:var(--shadow);margin-bottom:14px}
.tcloud .who{display:block;font-size:13.5px;font-weight:700;color:var(--muted);margin-bottom:2px;letter-spacing:.02em}
.tcloud i{position:absolute;background:#fff;border:2.5px solid var(--ink);border-radius:50%}
.tcloud i.b1{width:14px;height:14px;left:-6px;bottom:-12px}
.tcloud i.b2{width:8px;height:8px;left:-16px;bottom:-22px}

/* learn */
.band{border-radius:20px;padding:16px 20px;margin:0 0 16px}
.band h1{margin:0}
.band .kicker{font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;opacity:.85;margin-bottom:4px}
.lrow{margin:0 0 14px;font-size:21px;line-height:1.55}
.lrow b.lab{display:inline-block;margin-right:4px}
.example{display:grid;gap:10px;margin:0 0 16px}
.exrow{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 16px;box-shadow:var(--shadow)}
.exrow .exlab{font-size:15px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);margin-bottom:2px}
.exrow .exs{font-size:24px;line-height:1.5}
.exrow.after{border:2px solid var(--mintEdge)}
.xpart{text-decoration:line-through;text-decoration-thickness:3px;text-decoration-color:#4A4550;color:#7A7068}
.npart{background:var(--mint);border-radius:6px;padding:0 5px;font-weight:700}
.cheat{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.cheat span{background:#fff;border:1.5px solid var(--line2);border-radius:12px;padding:5px 12px;font-size:18px}
.sticky{background:#FFF2B8;border:1px solid #E6CF6A;border-radius:6px;padding:16px 20px;box-shadow:0 10px 20px rgba(31,27,36,.12);transform:rotate(-1.2deg);max-width:560px;margin:6px 0 20px;font-size:21px;line-height:1.5}
.sticky .sig{display:block;text-align:right;font-weight:700;margin-top:6px}
.how{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 20px;box-shadow:var(--shadow);margin-bottom:16px}
.how ol{margin:6px 0 0;padding-left:26px}
.how li{margin-bottom:6px}
.review{display:grid;gap:10px;margin:0 0 16px}
.rv{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 16px;box-shadow:var(--shadow);border-left:8px solid}
.rv .rvname{font-weight:800;font-size:18px}
.rv .rvrule{font-size:17px;color:var(--ink2)}
.rv .rvex{font-size:19px;margin-top:4px}
.bigscore{font-family:'Fraunces';font-weight:700;font-size:34px;margin:4px 0 12px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--page);border-top:1px solid var(--line);z-index:45}
.nav-in{max-width:820px;margin:0 auto;padding:10px 20px;display:flex;gap:12px;align-items:center}
.btn{border:0;border-radius:999px;padding:12px 24px;font-weight:700;cursor:pointer;font-size:18px;line-height:1.2;min-height:48px;white-space:nowrap}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:disabled{background:#BDB6AE;cursor:not-allowed}
.btn.ghost{background:#fff;border:2px solid var(--ink)}
.btn.ghost:disabled{opacity:.35;cursor:not-allowed}
.btn.soft{background:#F1EEEA;border:1.5px solid var(--line2)}
.btn.blue{background:var(--blueInk);color:#fff}
.btn.blue:disabled{background:#AFC3D8;cursor:not-allowed}
.navmsg{margin-left:auto;color:var(--ink2);font-size:16px;font-weight:700;text-align:right;line-height:1.3}


/* class version */
.who{display:flex;justify-content:space-between;gap:6px 12px;flex-wrap:wrap;font-size:15px;font-weight:600;color:var(--ink2);background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 12px;margin:0 0 14px}
.modebox{background:#fff;border:2px solid var(--blueEdge);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);margin:8px 0 18px}
.modebox.signed{border-color:var(--mintEdge);background:var(--mint)}
.modehead{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:26px;margin-bottom:10px}
.btn.wide{width:100%;white-space:normal;text-align:center}
.modenote{margin:6px 0 16px}
.linkbtn{background:none;border:0;padding:0;font:inherit;font-weight:700;color:var(--blueInk);text-decoration:underline;cursor:pointer;text-align:left}
.signstep{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.stephead{display:flex;align-items:center;gap:10px;font-weight:700;margin-bottom:8px;line-height:1.35}
.sn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:var(--blueInk);color:#fff;font-size:17px;flex:0 0 32px}
.secrow{display:flex;gap:10px;flex-wrap:wrap}
.secbtn{flex:1 1 220px;text-align:left;background:#fff;border:2px solid var(--line2);border-radius:14px;padding:10px 14px;cursor:pointer;font-size:19px;line-height:1.35}
.secbtn span{display:block;font-size:15px;color:var(--ink2)}
.secbtn.on{border-color:var(--blueInk);background:var(--blue)}
.secbtn.on b::before{content:'✓ '}
.field{width:100%;font:inherit;font-size:24px;letter-spacing:.06em;padding:10px 14px;border:2px solid var(--line2);border-radius:12px;background:#fff;color:var(--ink)}
.field:focus{outline:3px solid var(--blueEdge);outline-offset:1px}
.field[readonly]{background:#F4F1EC}
.err{color:var(--peachInk);font-weight:700;margin:4px 0 10px}
.err:empty{display:none}
.confirm{background:var(--blue);border:2px solid var(--blueEdge);border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
.bigid{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:38px;letter-spacing:.08em;line-height:1.2}
@media (max-width:600px){
  body{font-size:19px}
  h1{font-size:32px}h2{font-size:27px}
  .sent,.chunk,.plain,.punct{font-size:22px}
  .brand{font-size:18px}
  .sampletag{display:none}
  .btn{padding:11px 18px;font-size:17px}
  .navmsg{font-size:14.5px}
  .tile{font-size:19px}
}
@media (max-width:480px){.navmsg{display:none}.nav-in{justify-content:space-between}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <svg width="32" height="32" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="16" fill="#D6F3E4" stroke="#2F6B4F" stroke-width="1.5"/><path d="M17 6 L25 20 H9 Z" fill="#2F6B4F"/><path d="M17 12 L23 23 H11 Z" fill="#3F8A66"/><rect x="15.5" y="23" width="3" height="5" fill="#735800"/></svg>
      <div>Say It Shorter<small>Juniper Court · Part 1: Conciseness</small></div>

  </div>
</nav>

<script>
(function(){
'use strict';
var $ = function(s, r){ return (r || document).querySelector(s); };
var $$ = function(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function words(s){ var m = String(s).trim().match(/\S+/g); return m ? m.length : 0; }
function cap(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
function clone(o){ return JSON.parse(JSON.stringify(o)); }

/* ================= CLASS VERSION (recording) ================= */
var CONFIG = {
  ENDPOINT: 'https://script.google.com/macros/s/AKfycbz8sy_FMZsIJuAOQOtbmRqBn-P03bvZCW-Dev7BEBSWBblCSi0RF1CMTMS39JCzWvTgOQ/exec',
  SALT1: 'northline-ctstate-2026',
  ACTIVITY: 'SIS1',
  VERSION: 'sis1-2026-09-23c',
  SECTIONS: {'13046': {label:'CRN 13046', sub:'In person · Mon/Wed 12:30'}, '13901': {label:'CRN 13901', sub:'Live online · Mon/Wed 5:30'}}
};
var QS = (function(){ try { return new URLSearchParams(location.search); } catch(e){ return {get:function(){ return null; }}; } })();
if (QS.get('test') === '1') CONFIG.ACTIVITY += '-TEST';
var PRESET = CONFIG.SECTIONS[QS.get('s')] ? QS.get('s') : null;
var STORE_KEY = 'sayitshorter_' + CONFIG.ACTIVITY;
function newCls(){ return {mode:null, section:PRESET, h1:null, tail:'', code:'', recordId:null, startedAt:null, unverified:false, submitted:null, submitError:null, submitting:false}; }
function isClass(){ return !!(st && st.cls && st.cls.mode === 'class'); }
function save(){
  try { var o = {}; Object.keys(st).forEach(function(k){ if (k !== 'form' && k !== 'look') o[k] = st[k]; });
    sessionStorage.setItem(STORE_KEY, JSON.stringify({v:CONFIG.VERSION, st:o})); } catch(e){}
}
function restore(){
  try {
    var raw = sessionStorage.getItem(STORE_KEY); if (!raw) return false;
    var o = JSON.parse(raw);
    if (!o || o.v !== CONFIG.VERSION || !o.st || !o.st.pg || o.st.pg.length !== PAGES.length) return false;
    st = o.st; if (!st.cls) st.cls = newCls(); st.cls.submitting = false;
    if (st.view !== 'pages') st.view = 'pages';
    return true;
  } catch(e){ return false; }
}
function normalizeId(raw){ return String(raw || '').replace(/\D/g, ''); }
function normalizeCode(c){ return String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
function secLabel(s){ return CONFIG.SECTIONS[s] ? CONFIG.SECTIONS[s].label : String(s || ''); }
function shortId(h){ return h ? String(h).slice(0, 6).toUpperCase() : ''; }
function onClick(sel, fn){ var el = $(sel); if (el) el.addEventListener('click', fn); }
function showNav(on){ var n = $('.nav'); if (n) n.style.display = on ? '' : 'none'; }
function modeTag(){ var t = $('#modetag'); if (!t) return; if (!st.cls.mode){ t.style.display = 'none'; return; } t.style.display = ''; t.textContent = isClass() ? 'Class version' : 'Practice'; }
async function sha256Hex(text){
  var buf = new TextEncoder().encode(text);
  var hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash)).map(function(b){ return b.toString(16).padStart(2, '0'); }).join('');
}
async function postOnce(payload, timeoutMs){
  var ctrl = new AbortController();
  var t = setTimeout(function(){ ctrl.abort(); }, timeoutMs || 60000);
  try {
    var res = await fetch(CONFIG.ENDPOINT, {method:'POST', body:JSON.stringify(payload), signal:ctrl.signal, credentials:'omit', cache:'no-store'});
    var text = await res.text();
    try { return JSON.parse(text); } catch(e){ return {ok:false, error:'bad_response'}; }
  } catch(e){ return {ok:false, error:(e && e.name === 'AbortError') ? 'timeout' : 'network'}; }
  finally { clearTimeout(t); }
}
/* Google sometimes answers slowly or with an error page; try up to three times */
async function post(payload, timeoutMs){
  var r = null;
  for (var a = 0; a < 3; a++){
    r = await postOnce(payload, timeoutMs || 60000);
    if (r && (r.ok || (r.error !== 'timeout' && r.error !== 'network' && r.error !== 'bad_response'))) return r;
    await new Promise(function(res){ setTimeout(res, 1200 + a * 800); });
  }
  return r;
}
function whoStrip(p){
  if (!isClass() || p.type === 'start') return '';
  var c = st.cls;
  return '<div class="who"><span>🎓 Class version · ' + esc(secLabel(c.section)) + ' · ID ending in <b>' + esc(c.tail) + '</b></span>' + (c.recordId ? '<span>Record ' + esc(shortId(c.recordId)) + '</span>' : '') + '</div>';
}
function modeBox(){
  var c = st.cls;
  if (c.mode === 'class') return '<div class="modebox signed"><b>✅ You are signed in.</b> ' + esc(secLabel(c.section)) + ' · ID ending in <b>' + esc(c.tail) + '</b>. Press <b>Start ➤</b> at the bottom.</div>';
  if (c.mode === 'practice') return '<div class="modebox"><b>You are in practice mode.</b> Nothing is saved. Press <b>Start ➤</b> at the bottom.' +
    '<p class="small" style="margin:10px 0 0">Need points? <button class="linkbtn" type="button" id="toClass">Switch to the class version</button> (this starts over from page 1).</p></div>';
  return '<div class="modebox">' +
    '<div class="modehead">Choose one</div>' +
    '<button class="btn blue wide" type="button" id="goClass">🎓 Class version (for points) ➤</button>' +
    '<p class="small modenote">Use this in class. You need the <b>class code</b> your professor gives you. Your points and the sentences you type are saved for your professor.</p>' +
    '<button class="btn soft wide" type="button" id="goPractice">Practice only</button>' +
    '<p class="small modenote">Nothing is saved. No points count.</p>' +
    '<p class="small" style="margin:4px 0 0"><button class="linkbtn" type="button" id="goLookup">Already finished? Check that your result was saved.</button></p>' +
  '</div>';
}
function secButtons(locked){
  return '<div class="secrow">' + Object.keys(CONFIG.SECTIONS).map(function(k){ var s = CONFIG.SECTIONS[k], on = st.cls.section === k;
    return '<button type="button" class="secbtn' + (on ? ' on' : '') + '" data-sec="' + k + '" aria-pressed="' + on + '"' + (locked ? ' disabled' : '') + '><b>' + esc(s.label) + '</b><span>' + esc(s.sub) + '</span></button>'; }).join('') + '</div>';
}
function renderSignin(){
  showNav(false); modeTag();
  var f = st.form || (st.form = {id:'', code:'', confirm:false, err:''});
  var h = '<h1>Class version: sign in</h1>' +
    '<p class="lrow">Three short steps. Then the exercises start.</p>' +
    '<div class="signstep"><div class="stephead"><span class="sn">1</span> Tap your class.</div>' + secButtons(f.confirm) + '</div>' +
    '<div class="signstep"><label class="stephead" for="sid"><span class="sn">2</span> Type the 8 digit number you log in to Blackboard with.</label>' +
      '<p class="small" style="margin:0 0 8px">This is your Student ID. It starts with 0, for example 03083452.</p>' +
      '<input id="sid" class="field" inputmode="numeric" autocomplete="off" maxlength="14" value="' + esc(f.id) + '"' + (f.confirm ? ' readonly' : '') + '></div>' +
    '<div class="signstep"><label class="stephead" for="scode"><span class="sn">3</span> Type the class code.</label>' +
      '<p class="small" style="margin:0 0 8px">Your professor says it in class. It is a word and a number.</p>' +
      '<input id="scode" class="field" autocomplete="off" autocapitalize="characters" spellcheck="false" value="' + esc(f.code) + '"' + (f.confirm ? ' readonly' : '') + '></div>' +
    '<div id="serr" class="err" aria-live="polite">' + esc(f.err || '') + '</div>';
  if (!f.confirm){
    h += '<div class="btnrow"><button type="button" class="btn blue" id="signNext">Next ➤</button></div>';
  } else {
    var d = normalizeId(f.id);
    h += '<div class="confirm"><p style="margin:0 0 4px">You typed:</p><div class="bigid">' + esc(d.slice(0, 4) + ' ' + d.slice(4)) + '</div>' +
      '<p style="margin:8px 0 12px">Is this <b>your</b> Blackboard number? If it is wrong, your points go to no one.</p>' +
      '<div class="btnrow"><button type="button" class="btn blue" id="signYes">Yes, that is me ➤</button><button type="button" class="btn soft" id="signFix">No, let me fix it</button></div></div>';
  }
  h += '<div class="how" style="margin-top:18px"><b>🔒 What is saved</b><br>A scrambled version of your number, your points, the sentences you type, and the time. Your name is never saved. Your number is never saved the way you typed it.</div>' +
    '<p><button type="button" class="btn ghost" id="signBack">‹ Back to the start</button></p>';
  $('#page').innerHTML = h;
  var sid = $('#sid'), sc = $('#scode');
  if (sid) sid.addEventListener('input', function(){ f.id = sid.value; });
  if (sc) sc.addEventListener('input', function(){ f.code = sc.value; });
  if (!f.confirm) $$('[data-sec]').forEach(function(b){ b.addEventListener('click', function(){ keepInputs(); st.cls.section = b.dataset.sec; f.err = ''; renderSignin(); }); });
  onClick('#signNext', function(){
    keepInputs(); var d = normalizeId(f.id);
    if (!st.cls.section){ f.err = 'Step 1 is missing: tap your class.'; renderSignin(); return; }
    if (d.length !== 8){ f.err = 'Step 2: your number needs 8 digits. You typed ' + d.length + '.'; renderSignin(); return; }
    if (normalizeCode(f.code).length < 3){ f.err = 'Step 3 is missing: type the class code.'; renderSignin(); return; }
    f.err = ''; f.confirm = true; renderSignin();
  });
  onClick('#signFix', function(){ f.confirm = false; f.err = ''; renderSignin(); var i = $('#sid'); if (i) i.focus(); });
  onClick('#signYes', signIn);
  onClick('#signBack', function(){ st.form = null; st.view = 'pages'; go(0); });
}
function keepInputs(){ var sid = $('#sid'), sc = $('#scode'); if (!st.form) return; if (sid) st.form.id = sid.value; if (sc) st.form.code = sc.value; }
async function signIn(){
  var f = st.form, btn = $('#signYes');
  var d = normalizeId(f.id), code = normalizeCode(f.code);
  btn.disabled = true; btn.textContent = 'Checking the class code…';
  var wait = document.createElement('p'); wait.className = 'small'; wait.style.margin = '10px 0 0'; wait.textContent = '⏳ This can take up to one minute. Keep this page open.'; btn.parentNode.parentNode.appendChild(wait);
  var fx = $('#signFix'); if (fx) fx.disabled = true;
  var h1;
  try { h1 = await sha256Hex(CONFIG.SALT1 + '|' + d); }
  catch(e){ f.err = 'This browser could not scramble your number. Open this page in Chrome, Safari, or Edge.'; f.confirm = false; renderSignin(); return; }
  var r = await postOnce({action:'start', h1:h1, section:st.cls.section, activity:CONFIG.ACTIVITY, code:code, clientVersion:CONFIG.VERSION}, 45000);
  var unreachable = !r || r.error === 'timeout' || r.error === 'network' || r.error === 'bad_response';
  if (!unreachable && !r.ok){
    var why = {bad_code:'That class code is not right. Check it and type it again.',
      window_closed:'This activity is closed right now. It opens in class and stays open until 8:00 AM the next morning. Ask Professor Calafiore.',
      no_endpoint:'Saving is switched off on this copy of the page.'};
    f.err = why[r.error] || ('Something went wrong (' + r.error + '). Try again.');
    f.confirm = false; renderSignin(); return;
  }
  var c = st.cls;
  c.mode = 'class'; c.h1 = h1; c.tail = d.slice(-2); c.code = code; c.unverified = unreachable;
  c.recordId = (r && r.ok && r.recordId) || null; c.startedAt = new Date().toISOString();
  st.form = null; st.view = 'pages';
  go(1);

    g.style.left = a.left + 'px'; g.style.top = a.top + 'px'; g.style.width = a.width + 'px'; g.style.height = a.height + 'px';
    document.body.appendChild(g);
    var dx = (b.left + b.width / 2) - (a.left + a.width / 2), dy = (b.top + b.height / 2) - (a.top + a.height / 2);
    requestAnimationFrame(function(){ requestAnimationFrame(function(){

    var t = first ? cap(c.t) : c.t;

function tapChunk(p, s, btn){
  if (busy) return;
  var id = btn.dataset.id, c = seqChunks(p.seq).filter(function(x){ return x.id === id; })[0];
  var isTarget = p.targets.indexOf(id) >= 0 && !c.cut && !c.fixed;
  if (c.fixed){ s.fb = {kind:'note', html:'<b>👀 Already fixed.</b> You changed that part already. Look at the other parts.'}; render(); return; }
  if (p.type === 'cut'){
    if (isTarget){
      busy = true;
      btn.classList.add('leaving');

        busy = false;
        c.cut = true;
        var left = p.targets.filter(function(t){ var cc = seqChunks(p.seq).filter(function(x){ return x.id === t; })[0]; return !cc.cut; });

    return;

  var p = PAGES[st.i];
  $('#back').disabled = st.i === 0;
  var nx = $('#next');
  nx.disabled = !canNext();
  nx.style.visibility = (p.type === 'end' || (p.type === 'start' && !st.cls.mode)) ? 'hidden' : 'visible';
  nx.textContent = p.type === 'start' ? 'Start ➤' : (p.type === 'learn' ? 'Start the exercises ➤' : 'Next ➤');
  $('#barFill').style.width = Math.round(100 * st.i / (PAGES.length - 1)) + '%';
  $('#pcount').textContent = 'Page ' + (st.i + 1) + ' of ' + PAGES.length;
  $('#navmsg').textContent = canNext() ? '' : (p.type === 'end' ? '' : 'Finish the job in the blue box first.');
}
function go(i){
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  st.i = i; render(); window.scrollTo(0, 0);
  if (PAGES[i].type === 'end' && isClass()) submitFinal();
}
$('#next').addEventListener('click', function(){ if (canNext() && st.i < PAGES.length - 1) go(st.i + 1); });
$('#back').addEventListener('click', function(){ if (st.i > 0) go(st.i - 1); });

if (restore()){ setPoints(false); go(st.i); } else { setPoints(false); go(0); }
window.__ss = {st:function(){ return st; }, go:go, PAGES:PAGES, MAXPTS:MAXPTS, seqText:seqText, CONFIG:CONFIG};
})();
</script>
</body>
</html>
